[workspace]
resolver = "3"
members = ["src-tauri", "crates/indexer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 开发时依赖用 O1：构建快、索引类代码不至于慢到误导性能判断
[profile.dev.package."*"]
opt-level = 1
