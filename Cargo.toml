[workspace]
resolver = "3"
members = ["src-tauri", "crates/indexer", "crates/pipe", "crates/indexd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

